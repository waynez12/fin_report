            --border-color: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(88, 166, 255, 0.25);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-grad: linear-gradient(135deg, #58a6ff 0%, #bc8cff 100%);

        }

        body {

            background-image:

            color: var(--text-primary);
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 頂部導覽列 */
        header {

            max-width: 1100px;
            padding: 30px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .brand-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em;
        }

        .report-count-tag {
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.2);

            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* 主視覺看板 */

            margin-top: 20px;
            margin-bottom: 40px;
        }

        .hero-section h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .hero-section p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin: 0;
            font-weight: 300;
        }

        /* 搜尋框設計 */
        .search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(22, 27, 34, 0.6);
            border: 1px solid var(--border-color);
            padding: 16px 20px 16px 52px;
            border-radius: 30px;
            color: #ffffff;
            font-size: 1.05rem;
            box-sizing: border-box;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: var(--shadow);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.15), var(--shadow);
            background: rgba(22, 27, 34, 0.85);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .search-input:focus + .search-icon {
            color: var(--accent);
        }

        /* Tabs 切換按鈕與滑動底條 */
        .tabs-container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
            margin-bottom: 30px;
            position: relative;
        }

        .tabs {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 40px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 12px 30px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .tab-btn.active {
            color: #ffffff;
        }

        .tabs-indicator {
            position: absolute;
            height: calc(100% - 8px);
            background: var(--accent-grad);
            border-radius: 30px;
            top: 4px;
            left: 4px;
            z-index: 1;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
        }

        /* 內容容器 */
        .content-section {
            width: 100%;
            max-width: 1100px;
            padding: 0 24px 100px 24px;
            box-sizing: border-box;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================
           By Date 樣式
           ========================================== */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .time-group {
            position: relative;
        }

        .time-date-header {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-date-header::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: var(--border-color);
        }

        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* ==========================================
           By Company 樣式
           ========================================== */
        .company-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .company-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .company-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent-grad);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .company-card:hover {
            background: var(--card-hover-bg);
            border-color: var(--border-hover);
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(88, 166, 255, 0.1), 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .company-card:hover::before {
            opacity: 1;
        }

        .company-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .company-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
        }

        .company-ticker {
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            color: var(--accent);
            background: rgba(88, 166, 255, 0.08);
            border: 1px solid rgba(88, 166, 255, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .company-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .company-reports-list.expanded {
            display: flex;
            animation: slideDown 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nested-report-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.02);
            padding: 12px 16px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;

            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateX(4px);

            font-size: 0.75rem;

            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
            line-height: 1.4;
            flex-grow: 1;

            justify-content: space-between;
            align-items: center;

            color: var(--text-secondary);
            display: none;

            opacity: 0.5;

            font-size: 1.1rem;
            margin: 0;

        /* 頁尾 */

            width: 100%;
            text-align: center;
            padding: 40px 24px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });

        function initApp() {
            // 更新總數
            document.getElementById('reportCount').textContent = `共 ${reports.length} 篇研究報告`;

            // 渲染視圖
            renderDateView(reports);
            renderCompanyView(reports);
            renderTop10View(reports);

            // 初始化事件監聽
            initTabs();
            initSearch();
        }

        // ==========================================
        // 渲染 By Date
        // ==========================================

        function renderDateView(filteredReports) {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            if (filteredReports.length === 0) return;

            // 分組
            const groups = {};
            filteredReports.forEach(r => {
                if (!groups[r.date]) {
                    groups[r.date] = [];
                }
                groups[r.date].push(r);
            });

            // 排序日期 (新到舊)
            const sortedDates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

            sortedDates.forEach(date => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'time-group';

                const header = document.createElement('div');
                header.className = 'time-date-header';
                header.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span>${date}</span>
                `;
                groupDiv.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'report-grid';

                groups[date].forEach(r => {
                    const card = document.createElement('a');
                    card.href = r.html_path;
                    card.className = 'report-card';

                    let tagsHtml = '';
                    if (r.type === 'top10') {
                        tagsHtml += `<span class="tag ticker" style="background: rgba(188, 140, 255, 0.15); color: #bc8cff; border-color: rgba(188, 140, 255, 0.3);">Top 10</span>`;
                        tagsHtml += `<span class="tag company" style="background: rgba(88, 166, 255, 0.15); color: #58a6ff; border-color: rgba(88, 166, 255, 0.3);">總結報告</span>`;
                    } else {
                        if (r.ticker) {
                            tagsHtml += `<span class="tag ticker">${r.ticker}</span>`;
                        }
                        if (r.company && r.company !== r.ticker) {
                            tagsHtml += `<span class="tag company">${r.company}</span>`;
                        }
                    }

                    card.innerHTML = `
                        <div class="report-card-header">
                            <div class="tags-row">${tagsHtml}</div>
                        </div>
                        <div class="report-card-title">${escapeHtml(r.title)}</div>
                        <div class="report-card-footer">
                            <span class="card-date">${r.date}</span>
                            <span class="arrow-link">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12" y1="5" x2="19" y2="12" x1="12" y1="19"></polyline></svg>
                            </span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                groupDiv.appendChild(grid);
                container.appendChild(groupDiv);
            });
        }

        // ==========================================
        // 渲染 By Company (只包含一般報告)
        // ==========================================
        function renderCompanyView(filteredReports, autoExpand = false) {
            const container = document.getElementById('companyGridContainer');
            container.innerHTML = '';

            const individualReports = filteredReports.filter(r => r.type !== 'top10');
            if (individualReports.length === 0) return;

            // 按公司 (Ticker + Company) 分組
            const groups = {};
            individualReports.forEach(r => {
                // 如果沒有 ticker 就以 company 當 Key
                const key = r.ticker ? r.ticker : r.company;
                if (!groups[key]) {
                    groups[key] = {
                        ticker: r.ticker || '',
                        company: r.company || '未知公司',
                        reports: []
                    };
                }
                groups[key].reports.push(r);
            });

            // 排序公司：有 ticker 數字優先，無 ticker 的排後面
            const sortedKeys = Object.keys(groups).sort((a, b) => {
                const tickerA = groups[a].ticker;
                const tickerB = groups[b].ticker;
                if (tickerA && tickerB) return tickerA.localeCompare(tickerB);
                if (tickerA) return -1;
                if (tickerB) return 1;
                return groups[a].company.localeCompare(groups[b].company);
            });

            sortedKeys.forEach(key => {
                const group = groups[key];
                
                // 按日期排序歷史報告 (新到舊)
                group.reports.sort((a, b) => b.date.localeCompare(a.date));

                const card = document.createElement('div');
                card.className = 'company-card';

                // 點擊展開邏輯
                card.addEventListener('click', (e) => {
                    // 若點擊的是報告連結，就不要阻擋跳轉
                    if (e.target.closest('.nested-report-item')) return;
                    
                    const list = card.querySelector('.company-reports-list');
                    list.classList.toggle('expanded');
                });

                const reportsCount = group.reports.length;

                let listHtml = '';
                group.reports.forEach(r => {
                    listHtml += `
                        <a href="${r.html_path}" class="nested-report-item">
                            <span class="nested-title">${escapeHtml(r.title)}</span>
                            <span class="nested-date">${r.date}</span>
                        </a>
                    `;
                });

                card.innerHTML = `
                    <div class="company-card-header">
                        <div class="company-name">${escapeHtml(group.company)}</div>
                        ${group.ticker ? `<div class="company-ticker">${group.ticker}</div>` : ''}
                    </div>
                    <div class="company-count">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <span>${reportsCount} 篇研究報告</span>
                    </div>
                    <div class="company-reports-list ${autoExpand ? 'expanded' : ''}">
                        ${listHtml}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // ==========================================
        // 渲染 By Top 10 總結報告
        // ==========================================
        function renderTop10View(filteredReports) {
            const container = document.getElementById('top10GridContainer');
            container.innerHTML = '';

            const top10Reports = filteredReports.filter(r => r.type === 'top10');
            if (top10Reports.length === 0) return;

            top10Reports.forEach(r => {
                const card = document.createElement('a');
                card.href = r.html_path;
                card.className = 'report-card';

                let tagsHtml = `<span class="tag ticker" style="background: rgba(188, 140, 255, 0.15); color: #bc8cff; border-color: rgba(188, 140, 255, 0.3);">Top 10</span>`;
                tagsHtml += `<span class="tag company" style="background: rgba(88, 166, 255, 0.15); color: #58a6ff; border-color: rgba(88, 166, 255, 0.3);">總結報告</span>`;

                card.innerHTML = `
                    <div class="report-card-header">
                        <div class="tags-row">${tagsHtml}</div>
                    </div>
                    <div class="report-card-title">${escapeHtml(r.title)}</div>
                    <div class="report-card-footer">
                        <span class="card-date">${r.date}</span>
                        <span class="arrow-link">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12" y1="5" x2="19" y2="12" x1="12" y1="19"></polyline></svg>
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ==========================================
        // Tabs 控制
        // ==========================================
        function initTabs() {
            const tabs = document.getElementById('tabs');
            const buttons = tabs.querySelectorAll('.tab-btn');
            const indicator = document.getElementById('tabsIndicator');

            function updateIndicator(activeBtn) {
                indicator.style.width = `${activeBtn.offsetWidth}px`;
                indicator.style.left = `${activeBtn.offsetLeft}px`;
            }

            // 初始化寬度
            const activeBtn = tabs.querySelector('.tab-btn.active');
            if (activeBtn) {
                updateIndicator(activeBtn);
            }

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateIndicator(btn);

                    const targetTab = btn.getAttribute('data-tab');
                    document.querySelectorAll('.tab-content').forEach(content => {
                        content.classList.remove('active');
                    });

                    if (targetTab === 'date') {
                        document.getElementById('dateView').classList.add('active');
                    } else if (targetTab === 'company') {
                        document.getElementById('companyView').classList.add('active');
                    } else if (targetTab === 'top10') {
                        document.getElementById('top10View').classList.add('active');
                    }
                });
            });

            // 響應式：視窗重設時更新指示器位置
            window.addEventListener('resize', () => {
                const currentActive = tabs.querySelector('.tab-btn.active');
                if (currentActive) {
                    updateIndicator(currentActive);
                }
            });
        }

        // ==========================================
        // 搜尋控制
        // ==========================================
        function initSearch() {
            const searchInput = document.getElementById('searchInput');
            const noResults = document.getElementById('noResults');

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().strip();

                const filtered = reports.filter(r => {
                    const matchTitle = r.title.toLowerCase().includes(query);
                    const matchCompany = r.company.toLowerCase().includes(query);
                    const matchTicker = r.ticker.toLowerCase().includes(query);
                    const matchDate = r.date.replace(/-/g, '').includes(query) || r.date.includes(query);
                    return matchTitle || matchCompany || matchTicker || matchDate;
                });

                if (filtered.length === 0) {
                    document.getElementById('dateView').style.display = 'none';
                    document.getElementById('companyView').style.display = 'none';
                    document.getElementById('top10View').style.display = 'none';
                    noResults.classList.add('visible');
                } else {
                    document.getElementById('dateView').style.display = '';
                    document.getElementById('companyView').style.display = '';
                    document.getElementById('top10View').style.display = '';
                    noResults.classList.remove('visible');

                    // 重新渲染，搜尋時 By Company 預設全部展開以方便查閱
                    renderDateView(filtered);
                    renderCompanyView(filtered, query.length > 0);
                    renderTop10View(filtered);
                }
            });
        }

        // ==========================================
        // 工具函數
        // ==========================================
        function escapeHtml(string) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return string.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // 幫 String 加上 strip 功能
        String.prototype.strip = function() {
            return this.replace(/^\s+|\s+$/g, '');
        };
    </script>
